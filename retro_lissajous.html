<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RETROSCOPE // HUGGING FACE INCIDENT</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080d0b;color:#a4f3b4;font:14px 'Courier New',monospace}.shell{max-width:1180px;margin:24px auto;padding:22px;border:3px solid #323d34;border-radius:28px;background:linear-gradient(135deg,#242b27,#0d1511 70%);box-shadow:0 20px 80px #000}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;letter-spacing:.18em;color:#a0b9a6}.brand{font-weight:bold;font-size:18px}.led{color:#76ff92}.screen{position:relative;margin-top:17px;overflow:hidden;border:15px solid #151f18;border-radius:38px;background:#001609;box-shadow:inset 0 0 45px #000,0 0 0 2px #4c5b4b;aspect-ratio:16/9}canvas{width:100%;height:100%;display:block}.screen:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0px,#0000 3px,#0005 4px);opacity:.35;border-radius:20px}.hud{position:absolute;top:20px;left:24px;font-size:12px;letter-spacing:.14em;text-shadow:0 0 8px #63ffa1}.time{position:absolute;top:20px;right:24px;font-size:12px}.sub{position:absolute;bottom:28px;left:7%;width:86%;text-align:center;color:#dcffe1;font:clamp(15px,2vw,25px) 'Courier New',monospace;line-height:1.45;text-shadow:0 2px 8px #000,0 0 12px #51ff85;white-space:pre-wrap}.panel{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-top:20px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,.file{cursor:pointer;background:#162a1d;border:1px solid #426b4a;color:#c4ffcc;padding:9px 12px;border-radius:4px;font:inherit}button:hover,.file:hover{background:#284c30}button.active{background:#356442}input[type=range]{accent-color:#88fba3}#seek{width:100%;margin:18px 0 4px}.stats{font-size:11px;color:#86a990;text-align:right;line-height:1.8}.files{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.file input{display:none}.status{color:#a3b9a7;margin-top:14px;font-size:12px}.name{font-size:11px;color:#85a78d;overflow-wrap:anywhere;margin-top:10px}@med </style></head><body><main class="shell"><div class="top"><span class="brand">RETROSCOPE <span class="led">●</span></span><span>DUAL CHANNEL / PHOSPHOR DISPLAY / MODEL 1978</span></div><div class="screen"><canvas id="scope"></canvas><div class="hud" id="modeLabel">XY • LISSAJOUS</div><div class="time" id="clock">00:00 / 00:00</div><div class="sub" id="subtitle"></div></div><div class="panel"><div><div class="controls"><button id="play">▶ PLAY</button><button id="mode">XY MODE</button><button id="pauseSub">CC ON</button><button id="fullscreen">⛶ SCREEN</button><label>GAIN <input id="gain" type="range" min="0.4" max="4" step="0.05" value="1.7"></label><label>GLOW <input id="glow" type="range" min="0" max="2" step="0.05" value="1"></label></div><input id="seek" type="range" min="0" max="1000" value="0"><div class="files"><label class="file">LOAD MP3<input id="audioFile" type="file" accept="audio/*,.mp3"></label><label class="file">LOAD VTT<input id="vttFile" type="file" accept=".vtt,text/vtt,text/plain"></label></div></div><div class="stats"><div>CH A / LEFT&nbsp;&nbsp; CH B / RIGHT</div><div id="trackStatus">AUDIO: WAITING</div><div id="captionStatus">CAPTIONS: WAITING</div></div></div><div class="name">How_AI_Agents_Accidentally_Hacked_Hugging_Face</div><div class="status" id="status">Select the MP3 and matching VTT. If hosted beside this page, both files are loaded automatically.</div><audio id="audio" preload="metadata" crossorigin="anonymous"></audio></main><script>
const $=id=>document.getElementById(id),audio=$('audio'),canvas=$('scope'),ctx=canvas.getContext('2d');let ac,source,split,left,right,mono,mode=0,cues=[],captionOn=true,ready=false,loadedUrl=null;let w=0,h=0;function resize(){const d=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);w=r.width;h=r.height}new ResizeObserver(resize).observe(canvas);function setup(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();source=ac.createMediaElementSource(audio);split=ac.createChannelSplitter(2);left=ac.createAnalyser();right=ac.createAnalyser();mono=ac.createAnalyser();for(const a of [left,right,mono]){a.fftSize=2048;a.smoothingTimeConstant=.15}source.connect(split);split.connect(left,0);split.connect(right,1);source.connect(mono);source.connect(ac.destination)}function loadAudio(file){if(loadedUrl)URL.revokeObjectURL(loadedUrl);loadedUrl=URL.createObjectURL(file);audio.removeAttribute('crossorigin');audio.src=loadedUrl;audio.load();$('trackStatus').textContent='AUDIO: '+file.name;$('status').textContent='Audio ready. Press PLAY.'}function parseTime(s){const a=s.replace(',','.').split(':').map(Number);return a.reduce((v,x)=>v*60+x,0)}function parseVtt(s){s=s.replace(/^\uFEFF/,'').replace(/\r/g,'');const blocks=s.split(/\n\s*\n/);const out=[];for(const b of blocks){const lines=b.trim().split('\n');const i=lines.findIndex(x=>x.includes('-->'));if(i<0)continue;const m=lines[i].match(/(\d{1,2}:\d\d(?::\d\d)?[.,]\d+)\s*-->\s*(\d{1,2}:\d\d(?::\d\d)?[.,]\d+)/);if(!m)continue;const text=lines.slice(i+1).join('\n').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');out.push({start:parseTime(m[1]),end:parseTime(m[2]),text})}return out.sort((a,b)=>a.start-b.start)}async function loadVtt(file){cues=parseVtt(await file.text());$('captionStatus').textContent='CAPTIONS: '+cues.length+' CUES';$('status').textContent='VTT loaded: '+file.name} $('audioFile').onchange=e=>{if(e.target.files[0])loadAudio(e.target.files[0])};$('vttFile').onchange=e=>{if(e.target.files[0])loadVtt(e.target.files[0])};$('play').onclick=async()=>{try{setup();await ac.resume();if(audio.paused)await audio.play();else audio.pause()}catch(e){$('status').textContent='Playback error: '+e.message}};audio.onplay=()=>{$('play').textContent='Ⅱ PAUSE'};audio.onpause=()=>{$('play').textContent='▶ PLAY'};$('mode').onclick=()=>{mode=(mode+1)%3;const names=['XY MODE','WAVE MODE','SPLIT MODE'];$('mode').textContent=names[mode];$('modeLabel').textContent=['XY • LISSAJOUS','TIME • OSCILLOSCOPE','DUAL • CHANNEL'][mode]};$('pauseSub').onclick=()=>{captionOn=!captionOn;$('pauseSub').textContent=captionOn?'CC ON':'CC OFF';if(!captionOn)$('subtitle').textContent=''};$('fullscreen').onclick=()=>{const el=document.querySelector('.screen');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};$('seek').oninput=e=>{if(isFinite(audio.duration)&&audio.duration)audio.currentTime=e.target.value/1000*audio.duration};const fmt=t=>{if(!isFinite(t))return'00:00';return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')};function draw(){requestAnimationFrame(draw);if(!w||!h)return;ctx.fillStyle='rgba(0,17,7,.23)';ctx.fillRect(0,0,w,h);const cx=w/2,cy=h/2;ctx.lineWidth=1;ctx.strokeStyle='rgba(52,120,67,.2)';ctx.beginPath();for(let x=cx%40;x<w;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,h)}for(let y=cy%40;y<h;y+=40){ctx.moveTo(0,y);ctx.lineTo(w,y)}ctx.stroke();ctx.strokeStyle='rgba(83,168,91,.25)';ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,h);ctx.moveTo(0,cy);ctx.lineTo(w,cy);ctx.stroke();const n=2048,L=new Float32Array(n),R=new Float32Array(n);if(ac){left.getFloatTimeDomainData(L);right.getFloatTimeDomainData(R)}else{const t=performance.now()*.001;for(let i=0;i<n;i++){const q=i/n*Math.PI*2;L[i]=.48*Math.sin(q*3+t);R[i]=.48*Math.sin(q*4+t*.7)}}const gain=+$('gain').value,glow=+$('glow').value;function trace(fn,color){ctx.beginPath();for(let i=0;i<n;i+=2){const [x,y]=fn(i);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=color;ctx.lineWidth=1.35;ctx.shadowBlur=18*glow;ctx.shadowColor=color;ctx.globalAlpha=.6;ctx.stroke();ctx.lineWidth=.75;ctx.globalAlpha=1;ctx.shadowBlur=3*glow;ctx.stroke();ctx.shadowBlur=0}if(mode===0){
// Audio-driven phase portrait: silence is a dot; speech expands into a
// rounded, irregular field. Delayed mono samples avoid the L=R diagonal.
let energy=0;for(let j=0;j<n;j+=4){const v=(L[j]+R[j])*.5;energy+=v*v}
const rms=Math.sqrt(energy/(n/4));
const extent=Math.min(w,h)*.43;
// Several time delays create a natural phosphor cloud, not a drawn circle.
// The envelope is derived entirely from the samples: quiet audio stays centered.
const delays=[13,29,47];
for(let k=0;k<delays.length;k++){
 const lag=delays[k];
 trace(i=>{
   const x=(L[i]+R[i])*.5;
   const j=(i+lag)%n;
   const y=(L[j]+R[j])*.5;
   const scale=extent*gain;
   return [cx+Math.max(-extent,Math.min(extent,x*scale)),
           cy-Math.max(-extent,Math.min(extent,y*scale))];
 },k===0?'#81ffa2':k===1?'#64d88b':'#4cae70');
}
}else if(mode===1)trace(i=>[i/n*w,cy-L[i]*h*.38*gain],'#81ffa2');else{trace(i=>[i/n*w,h*.28-L[i]*h*.22*gain],'#81ffa2');trace(i=>[i/n*w,h*.72-R[i]*h*.22*gain],'#c5e77e')}const t=audio.currentTime||0;$('clock').textContent=fmt(t)+' / '+fmt(audio.duration);if(audio.duration&&document.activeElement!==$('seek'))$('seek').value=t/audio.duration*1000;if(captionOn){const active=cues.filter(c=>t>=c.start&&t<c.end);$('subtitle').textContent=active.map(c=>c.text).join('\n')} }draw();(async()=>{const base='How_AI_Agents_Accidentally_Hacked_Hugging_Face';try{const r=await fetch(base+'.vtt');if(r.ok){cues=parseVtt(await r.text());$('captionStatus').textContent='CAPTIONS: '+cues.length+' CUES'}}catch{}try{const r=await fetch(base+'.mp3',{method:'HEAD'});if(r.ok){audio.src=base+'.mp3';$('trackStatus').textContent='AUDIO: AUTO-LOADED';$('status').textContent='Media detected beside HTML. Press PLAY.'}}catch{}})();
</script></body></html>
