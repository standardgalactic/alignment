<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Institutional Incentives and the Recurrence of Harm</title>
<style>
:root{color-scheme:dark;--phosphor:#a5e7a0;--dim:#608461;--bg:#080b08}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--phosphor);font:13px 'Courier New',monospace}main{width:min(92vw,650px);padding:24px 0;text-align:center}h1{font-size:13px;font-weight:normal;letter-spacing:.12em;margin:0 0 22px;text-transform:uppercase;line-height:1.6}.scope{position:relative;width:min(100%,440px,53dvh);aspect-ratio:1;margin:auto;border-radius:50%;overflow:hidden;border:1px solid #354b35;background:#020602;box-shadow:0 0 0 7px #101610,0 0 0 8px #242c24,inset 0 0 40px #000}canvas{position:absolute;inset:0;width:100%;height:100%}.scope:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:50%;background:radial-gradient(circle,transparent 58%,#0008 100%),repeating-linear-gradient(0deg,transparent 0 3px,#0002 3px 4px)}.controls{display:flex;align-items:center;gap:12px;width:min(100%,440px);margin:23px auto 0}button{font:inherit;color:var(--phosphor);background:transparent;border:1px solid #49634a;padding:7px 10px;cursor:pointer;min-width:62px}button:hover,button:focus-visible{background:#182718}input[type=range]{flex:1;min-width:0;accent-color:var(--phosphor);height:16px;cursor:pointer}input:disabled{opacity:.4;cursor:default}#clock{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}#captions{min-height:4.5em;margin:20px auto 8px;max-width:600px;line-height:1.55;font-size:14px;color:#c3e6bf}#status{font-size:10px;letter-spacing:.08em;color:var(--dim);min-height:1.4em}a{display:inline-block;margin-top:12px;color:var(--dim);font-size:12px;line-height:1.5;text-decoration:none}a:hover,a:focus-visible{color:var(--phosphor);text-decoration:underline}
</style>
</head>
<body><main>
<h1>Institutional Incentives<br>and the Recurrence of Harm</h1>
<div class="scope"><canvas id="scope" aria-label="Live audio X–Y oscilloscope"></canvas></div>
<div class="controls"><button id="play" type="button" disabled>WAIT</button><input id="seek" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="Seek through recording"><span id="clock">0:00 / 0:00</span></div>
<div id="captions"></div><div id="status" role="status">STANDBY</div>
<a href="https://standardgalactic.github.io/alignment/institutional-incentives.pdf" target="_blank" rel="noopener noreferrer">Institutional Incentives and the Recurrence of Harm</a>

<audio id="audio" preload="metadata"></audio>
</main><script>
'use strict';
const play=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),caption=document.getElementById('captions'),status=document.getElementById('status'),canvas=document.getElementById('scope'),g=canvas.getContext('2d'),audio=document.getElementById('audio');
const N=480,dpr=Math.min(devicePixelRatio||1,2);canvas.width=N*dpr;canvas.height=N*dpr;g.scale(dpr,dpr);
let ctx=null,analyser=null,wave=null,drag=false,cues=[],subtitleState='LOADING SUBTITLES',lastCaption=null;
let usingBlob=false,fallbackBusy=false,pending=null,pendingTimer=null;
const MP3='Why_Systems_Keep_Manufacturing_Bad_Actors.mp3';
function fmt(t){if(!Number.isFinite(t))return '0:00';t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function report(s){status.textContent=s;}
function duration(){return Number.isFinite(audio.duration)?audio.duration:0;}
function ready(){report('AUDIO READY / '+subtitleState);}
function sync(){const d=duration(),t=drag?Number(seek.value):audio.currentTime;if(d&&!drag)seek.value=t;clock.textContent=fmt(t)+' / '+fmt(d);}
/* Playback uses a normal streaming audio element, so it starts as soon as
   the first data arrives. The analyser is attached on first play. */
function graph(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=2048;wave=new Float32Array(analyser.fftSize);const node=ctx.createMediaElementSource(audio);node.connect(analyser);analyser.connect(ctx.destination);}
function setup(){const d=duration();if(!d)return;seek.max=d;seek.step='0.01';seek.disabled=false;play.disabled=false;if(audio.paused)play.textContent='PLAY';if(!fallbackBusy)ready();sync();}
audio.addEventListener('loadedmetadata',setup);
audio.addEventListener('durationchange',setup);
audio.addEventListener('play',()=>{play.textContent='PAUSE';});
audio.addEventListener('pause',()=>{if(!fallbackBusy)play.textContent='PLAY';});
audio.addEventListener('ended',()=>{play.textContent='PLAY';});
audio.addEventListener('waiting',()=>{if(!fallbackBusy)report('BUFFERING');});
audio.addEventListener('playing',()=>{if(!fallbackBusy)ready();});
audio.addEventListener('error',()=>{if(!usingBlob)report('AUDIO LOAD ERROR');});
audio.src=MP3;
play.addEventListener('click',async()=>{try{graph();await ctx.resume();if(audio.paused)await audio.play();else audio.pause();}catch(e){report('PLAYBACK ERROR');console.error(e);}});
/* Seeking. If the server cannot serve byte ranges, the browser restarts the
   file from zero after a seek. That case is detected and only then is the
   file fetched into memory, which is always seekable. */
function near(t,target){return t>=target-1&&t<=target+4;}
async function fallback(target){
  if(usingBlob||fallbackBusy)return;
  fallbackBusy=true;report('LOADING AUDIO FOR SEEKING');
  try{
    const response=await fetch(MP3);if(!response.ok)throw Error('HTTP '+response.status);
    const blob=await response.blob();
    const wasPlaying=!audio.paused;
    const url=URL.createObjectURL(blob.type?blob:new Blob([blob],{type:'audio/mpeg'}));
    usingBlob=true;
    audio.addEventListener('loadedmetadata',()=>{audio.currentTime=target;if(wasPlaying)audio.play().catch(()=>{});},{once:true});
    audio.src=url;audio.load();
  }catch(e){console.error(e);report('SEEK UNAVAILABLE');}
  fallbackBusy=false;if(status.textContent!=='SEEK UNAVAILABLE')ready();
}
function verify(){if(pending===null)return;const t=pending;pending=null;clearTimeout(pendingTimer);if(!usingBlob&&!near(audio.currentTime,t))fallback(t);}
function requestSeek(target){pending=target;clearTimeout(pendingTimer);pendingTimer=setTimeout(verify,2500);audio.currentTime=target;}
audio.addEventListener('seeked',()=>{if(pending!==null)verify();});
function commit(){if(!drag)return;drag=false;requestSeek(Number(seek.value));sync();updateCaption();}
seek.addEventListener('pointerdown',()=>{if(!seek.disabled)drag=true;});
seek.addEventListener('input',()=>{drag=true;sync();updateCaption();});
seek.addEventListener('change',commit);
seek.addEventListener('pointerup',commit);
seek.addEventListener('pointercancel',commit);
seek.addEventListener('blur',commit);
function stamp(s){const p=s.trim().replace(',','.').split(':').map(Number);return p.reduce((a,b)=>a*60+b,0);}
async function subtitles(){try{const r=await fetch('Why_Systems_Keep_Manufacturing_Bad_Actors.vtt');if(!r.ok)throw Error(r.status);const text=(await r.text()).replace(/^﻿/,'').replace(/\r\n?/g,'\n');for(const block of text.split(/\n\s*\n/)){const lines=block.trim().split('\n');const i=lines.findIndex(l=>l.includes('-->'));if(i<0||/^(NOTE|STYLE|REGION)(\s|$)/.test(lines[0]))continue;const [a,b]=lines[i].split('-->');const start=stamp(a),end=stamp(b.trim().split(/\s+/)[0]);const value=lines.slice(i+1).join(' ').replace(/<[^>]*>/g,'').trim();if(Number.isFinite(start)&&Number.isFinite(end)&&end>start&&value)cues.push({start,end,value});}cues.sort((a,b)=>a.start-b.start);subtitleState=cues.length?'SUBTITLES READY':'NO SUBTITLE CUES';}catch(e){subtitleState='SUBTITLES UNAVAILABLE';}if(duration()&&!fallbackBusy)ready();}
function updateCaption(){const t=drag?Number(seek.value):audio.currentTime;let text='';for(const c of cues){if(c.start>t)break;if(t<c.end)text+=(text?' ':'')+c.value;}if(text!==lastCaption){caption.textContent=text;lastCaption=text;}}
subtitles();
let gain=1,last=performance.now();
function draw(now){const dt=Math.min(100,now-last);last=now;const c=N/2,R=N*.43;g.fillStyle=`rgba(2,7,2,${1-Math.exp(-dt/65)})`;g.fillRect(0,0,N,N);
// Static, faint oscilloscope graticule.
g.save();g.beginPath();g.arc(c,c,R,0,Math.PI*2);g.clip();g.strokeStyle='#8bd88b0d';g.lineWidth=.7;g.beginPath();g.moveTo(c-R,c);g.lineTo(c+R,c);g.moveTo(c,c-R);g.lineTo(c,c+R);for(let i=-4;i<=4;i++){const p=i*R/5;g.moveTo(c+p,c-4);g.lineTo(c+p,c+4);g.moveTo(c-4,c+p);g.lineTo(c+4,c+p);}g.stroke();
const playing=!audio.paused&&!audio.ended;
if(analyser&&playing){analyser.getFloatTimeDomainData(wave);let sum=0,peak=0;for(const v of wave){sum+=v*v;peak=Math.max(peak,Math.abs(v));}const rms=Math.sqrt(sum/wave.length);const desired=Math.min(5,.28/Math.max(.055,rms));gain+=(desired-gain)*.09;const scale=R*Math.min(gain,.94/Math.max(.001,peak));const lag=Math.max(1,Math.round(ctx.sampleRate*.0027));if(rms>.0005){g.beginPath();for(let i=0;i<wave.length-lag;i+=2){const x=c+wave[i]*scale,y=c-wave[i+lag]*scale;if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}g.strokeStyle='#b5ffad';g.lineWidth=.9;g.shadowColor='#7cff70';g.shadowBlur=5;g.stroke();g.shadowBlur=0;}}
else if(!playing){g.fillStyle='#b5ffad';g.beginPath();g.arc(c,c,1.3,0,Math.PI*2);g.fill();}g.restore();sync();updateCaption();requestAnimationFrame(draw);}
g.fillStyle='#020702';g.fillRect(0,0,N,N);requestAnimationFrame(draw);sync();
</script></body></html>
